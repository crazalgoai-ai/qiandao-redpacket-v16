<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千岛湖淳鱼 · V16 每笔确认收款</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="demo-shell"><aside class="demo-info"><span class="tag">V16 · 每笔红包确认收款</span><h1>红包活动<br>精简流程演示</h1><p class="short-intro">“我的奖品”放在问题反馈下方，识别用户后有待领取红包时显示数字角标。抽红包仅在当前码绑定活动且仍有机会时展示，抽完后自动隐藏。</p><div class="review-controls"><h2 class="panel-title">完整流程演示</h2><label for="activity-status">活动状态</label><select id="activity-status"><option value="active">活动进行中 · 抽红包</option><option value="ended">活动已结束 · 我的奖品</option></select><div id="result-controls"><label for="scenario">模拟结果</label><select id="scenario"><option value="cash:0.88">中奖 · 0.88 元</option><option value="miss">未中奖 · 谢谢参与</option><option value="draw-error">抽奖异常</option><option value="failed">红包发放异常</option><option value="other">该码已被抽取</option></select></div><div class="control-row"><button id="reset">重新演示</button><span>当前状态：<b id="state-label"></b></span></div></div><section class="state-browser"><h2 class="panel-title">单个界面状态</h2><p class="panel-caption">按类型查看页面，不必从头走流程</p><section class="state-group"><h3>活动主流程</h3><div class="state-buttons"><button data-preset="entry-ready">可抽奖 · 显示红包</button><button data-preset="entry-unbound">未绑定活动 · 隐藏红包</button><button data-preset="entry-known-pending">已授权 · 有待领取</button><button data-preset="entry-known-clear">已授权 · 无待领取</button><button data-preset="invite">大转盘</button><button data-preset="drawing">抽奖中</button><button data-preset="miss">谢谢参与</button><button data-preset="unclaimed">中奖 · 待领取</button><button data-preset="pending">红包发放中</button><button data-preset="issued">红包已到账</button><button data-preset="claimed">该码已抽取</button></div></section><section class="state-group"><h3>授权流程</h3><div class="state-buttons"><button data-preset="auth-user">用户信息授权</button><button data-preset="location-auth">位置信息授权</button></div></section><section class="state-group"><h3>红包收款</h3><div class="state-buttons"><button data-preset="receipt-confirm">微信确认收款</button><button data-preset="receipt-done">微信收款完成</button></div></section><section class="state-group"><h3>我的奖品与规则</h3><div class="state-buttons"><button data-preset="prizes-entry">我的奖品 · 统一入口</button><button data-preset="history">我的奖品 · 有记录</button><button data-preset="history-empty">我的奖品 · 空</button><button data-preset="rules">活动规则</button></div></section><section class="state-group"><h3>异常提醒</h3><div class="state-buttons"><button data-preset="draw-error">统一异常提醒</button></div></section></section><details class="advanced-options"><summary>授权配置（仅供评审）</summary><div class="location-review"><label>位置能力<select id="location-capability"><option value="available">已开通 · 获取位置</option><option value="unavailable">未获批 · 跳过位置</option></select></label><label>定位结果<select id="location-result"><option value="success">获取成功</option><option value="failed">获取失败</option></select></label></div></details><p class="demo-hint">仅交互演示，不连接真实微信或营销 SaaS。左侧为评审工具，右侧为消费者界面。</p></aside><main class="demo-phone"><div class="phone" id="interactive" aria-live="polite"></div></main></div><script src="assets/app.js" defer></script></body></html>
